name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master # Deploy automatically on pushes to main or master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-size: 20
          cache: 'npm'

      - name: Install Dependencies 🔧
        run: npm install

      - name: Build Application 🏗️
        run: npm run build

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite builds static assets into dist/
          branch: gh-pages # Target branch for GitHub Pages
          clean: true
